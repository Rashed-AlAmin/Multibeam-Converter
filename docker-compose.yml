# One command brings the whole thing up:
#
#     docker compose up --build
#
# then open http://localhost:3000
#
# The first build compiles MB-System from source and takes roughly 30-45
# minutes on a modest machine. Subsequent builds reuse that layer.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: multibeam-converter-backend
    environment:
      JOB_ROOT: /data/jobs
      MAX_UPLOAD_BYTES: "2147483648"   # 2 GiB
      LOG_LEVEL: INFO
    volumes:
      # Job scratch space lives on a named volume, not in the container's
      # writable layer, so a multi-gigabyte survey never bloats the image
      # and the data survives a container restart.
      - job-data:/data/jobs
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).status==200 else 1)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: multibeam-converter-frontend
    environment:
      # Used by the Next server to proxy small JSON calls to the backend.
      BACKEND_URL: http://backend:8000
      # Handed to the BROWSER at runtime so bulk traffic (upload, download)
      # goes straight to the backend, which streams it to disk. Next buffers
      # a proxied body in memory, so routing a multi-gigabyte upload through
      # the proxy would exhaust the Node process.
      #
      # This must be reachable FROM THE BROWSER. Change the host if you are
      # not running on the same machine; unset it to fall back to the proxy.
      PUBLIC_API_BASE: http://localhost:8000
      MAX_UPLOAD_BYTES: "2147483648"   # 2 GiB
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  job-data:
